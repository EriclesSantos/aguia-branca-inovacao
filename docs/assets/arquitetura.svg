<text x="60" y="145" fill="#a9bed4" font-size="18">Três perfis conectam as ideias dos colaboradores à gestão de projetos e estratégias.</text><rect x="60" y="205" width="400" height="270" rx="18" fill="#162b43" stroke="#35516e"/><rect x="60" y="205" width="6" height="270" rx="3" fill="#6ce5c6"/><text x="84" y="245" font-size="23" fill="#6ce5c6" font-weight="700">01  Operador</text><text x="84" y="283" font-size="18" fill="#e2ebf6">Propõe melhorias</text><text x="84" y="312" font-size="18" fill="#e2ebf6">Cadastra e acompanha suas ideias</text><text x="84" y="341" font-size="18" fill="#e2ebf6">Consulta estratégias</text><rect x="520" y="205" width="400" height="270" rx="18" fill="#162b43" stroke="#35516e"/><rect x="520" y="205" width="6" height="270" rx="3" fill="#83b8ff"/><text x="544" y="245" font-size="23" fill="#83b8ff" font-weight="700">02  Gestor</text><text x="544" y="283" font-size="18" fill="#e2ebf6">Avalia propostas e prioridades</text><text x="544" y="312" font-size="18" fill="#e2ebf6">Organiza projetos e prazos</text><text x="544" y="341" font-size="18" fill="#e2ebf6">Atualiza progresso e investimento</text><rect x="980" y="205" width="400" height="270" rx="18" fill="#162b43" stroke="#35516e"/><rect x="980" y="205" width="6" height="270" rx="3" fill="#d5a8ff"/><text x="1004" y="245" font-size="23" fill="#d5a8ff" font-weight="700">03  Liderança</text><text x="1004" y="283" font-size="18" fill="#e2ebf6">Define estratégias</text><text x="1004" y="312" font-size="18" fill="#e2ebf6">Consulta projetos e resultados</text><text x="1004" y="341" font-size="18" fill="#e2ebf6">Acompanha indicadores</text><path d="M460,330 L520,330" fill="none" stroke="#5b8fa4" stroke-width="2"/><text x="490.0" y="320.0" text-anchor="middle" font-size="15" fill="#9bb6ce">→</text><path d="M920,330 L980,330" fill="none" stroke="#5b8fa4" stroke-width="2"/><text x="950.0" y="320.0" text-anchor="middle" font-size="15" fill="#9bb6ce">→</text><rect x="60" y="565" width="400" height="185" rx="18" fill="#162b43" stroke="#35516e"/><rect x="60" y="565" width="6" height="185" rx="3" fill="#65dfbd"/><text x="84" y="605" font-size="23" fill="#65dfbd" font-weight="700">Android nativo</text><text x="84" y="643" font-size="18" fill="#e2ebf6">Java 17 + layouts XML</text><text x="84" y="672" font-size="18" fill="#e2ebf6">Activities e componentes Material</text><rect x="520" y="565" width="400" height="185" rx="18" fill="#162b43" stroke="#35516e"/><rect x="520" y="565" width="6" height="185" rx="3" fill="#83b8ff"/><text x="544" y="605" font-size="23" fill="#83b8ff" font-weight="700">Firebase</text><text x="544" y="643" font-size="18" fill="#e2ebf6">Authentication: sessão de usuário</text><text x="544" y="672" font-size="18" fill="#e2ebf6">Firestore: persistência em nuvem</text><rect x="980" y="565" width="400" height="185" rx="18" fill="#162b43" stroke="#35516e"/><rect x="980" y="565" width="6" height="185" rx="3" fill="#d5a8ff"/><text x="1004" y="605" font-size="23" fill="#d5a8ff" font-weight="700">Autorização</text><text x="1004" y="643" font-size="18" fill="#e2ebf6">Security Rules por perfil</text><text x="1004" y="672" font-size="18" fill="#e2ebf6">Cadastro inicial como operador</text><path d="M260,475 L260,565" fill="none" stroke="#5b8fa4" stroke-width="2"/><path d="M720,475 L720,565" fill="none" stroke="#5b8fa4" stroke-width="2"/><path d="M1180,475 L1180,565" fill="none" stroke="#5b8fa4" stroke-width="2"/><text x="60" y="832" font-size="17" fill="#9fb6ce">PROJETO ACADÊMICO FIAP · Diagrama baseado no código; não é captura da interface.</text></g></svg>